name = "the-big-brain"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# GIT_SHA is "dev" locally (also set in .dev.vars). Production deploys override it
# via `wrangler deploy --var GIT_SHA:<sha>` (see scripts/deploy.mjs).
[vars]
GIT_SHA = "dev"

[[d1_databases]]
binding = "DB"
database_name = "the-big-brain"
database_id = "d7d1d269-a23c-404b-997a-fd3f0a5f7556"
migrations_dir = "src/db/migrations"

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "MANAGER_DO"
class_name = "ManagerDO"

[[durable_objects.bindings]]
name = "AGENT_HUB_DO"
class_name = "AgentHubDO"

[[migrations]]
tag = "v1"
new_classes = ["ManagerDO"]

# Phase 4 — adding AgentHubDO. Don't edit v1; new changes go in new tags.
[[migrations]]
tag = "v2"
new_classes = ["AgentHubDO"]

# Enable importing Markdown files as text (used for prompts/manager.md).
# `fallthrough = true` keeps the file visible to other potential loaders.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
